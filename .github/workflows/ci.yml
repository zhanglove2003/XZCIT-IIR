# =====================================================================
# XZCIT-IIR 持续集成
#
# 分支治理（与仓库分支保护配套，清单见本节注释末）：
#   - main       ：纯文本/门面分支。**不跑 CI、不设 PR 限制**。
#                  本文件的 push / pull_request 触发器里绝不出现 main。
#   - dev 系     ：日常开发分支，允许直接 push，推送即触发全套检查（无需 PR）。
#   - feat 系    ：功能集成/受保护分支。禁止直接 push，只允许从 dev 系
#                  通过 PR 合入，且 PR 必须通过 branch-policy + ci-gate。
#
# 分支名兼容说明：
#   仓库实际使用带车型后缀的分支（dev/differential、feat/differential…），
#   因此触发器写作 `dev` + `dev/**`、`feat` + `feat/**`。语义与
#   「只有 dev / feat」一致：dev 系 → feat 系，只是额外允许车型后缀。
#
# 结构：
#   changes       —— dorny/paths-filter 按目录过滤，未命中的技术栈 Job 直接 skip
#   branch-policy —— PR 目标是 feat 系时，校验来源分支必须是 dev 系
#   hygiene       —— 每次必跑：残留文件拦截 + Python 语法兜底 + ruff 静态检查
#   ci-gate       —— if: always() 的汇总门禁，feat 系唯一 Required Status Check
#
# 分支保护勾选清单（GitHub 网页端 Settings → Rules / Branches）：
#   feat / feat/* ：禁止直接 push、要求 PR 合并、Required check = `ci-gate`
#   dev  / dev/*  ：不做 PR 拦截（允许直接 push），不绑定 Required check
#   main          ：不做 PR 拦截，不绑定任何 Required check（不跑 CI）
# =====================================================================
name: XZCIT CI

on:
  # dev 系允许直接 push，推送即跑全套。
  push:
    branches:
      - dev
      - 'dev/**'
  # 只有发往 feat 系的 PR 才跑（feat 禁止直接 push，只能走 PR）。
  pull_request:
    branches:
      - feat
      - 'feat/**'
  # 手动触发：仅用于在 feat 上制造一次真实的 ci-gate 运行记录。
  # 原因：GitHub 分支保护的 required status checks 候选列表只收录
  # 「在受保护分支上真实跑过的 check」。feat 平时不接受 push，也没有以它自身
  # 为 head 的 PR，配门禁时搜不到 ci-gate。手动跑一次即可补齐这条记录。
  # 手动触发不改变任何自动触发语义。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支连续推送只保留最新一次运行，避免浪费算力。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 统一 py_compile 的字节码落点，避免在仓库里生成 __pycache__。
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.pycache-ci

jobs:
  # ── 变更过滤：决定哪些技术栈 Job 需要跑 ─────────────────────────
  changes:
    name: detect-changes
    runs-on: ubuntu-24.04
    outputs:
      rust:     ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ros:      ${{ steps.filter.outputs.ros }}
      stm32:    ${{ steps.filter.outputs.stm32 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动触发时下面用 <sha>~1 当 paths-filter 基线，必须能取到父提交；
          # PR / push 场景 paths-filter 自己会取目标分支，这个深度对它无害。
          fetch-depth: 2
      - name: 按目录过滤变更
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 基线按事件区分：
          #   workflow_dispatch —— 没有 github.event.before，paths-filter 会因缺基线
          #                        直接报错，导致全部 Job 被 skip（ci-gate 照样绿，
          #                        但等于没验证）。用 <sha>~1 兜底覆盖整条待验证变更。
          #   pull_request      —— 留空，由 paths-filter 用 merge-base 自行计算，
          #                        只跑改动目录对应的 Job。
          #   push              —— 留空时 paths-filter 退回默认分支 main 做比较。
          #                        main 是只放文档的纯文本分支，diff 天然覆盖整棵树，
          #                        因此 dev 每次 push 四个技术栈全跑 —— 这正是
          #                        「dev 允许直接 push，push 即触发全套 CI」的约定，
          #                        属预期行为，不是过滤失效。
          base: ${{ github.event_name == 'workflow_dispatch' && format('{0}~1', github.sha) || '' }}
          filters: |
            # Rust：整个 Web-Next（含 build.rs、Cargo.toml、src/）
            rust:
              - 'Master/Web-Next/**'
            # 前端：静态资源目录，或把资源编进二进制的 main.rs
            frontend:
              - 'Master/Web-Next/web/**'
              - 'Master/Web-Next/src/main.rs'
            # ROS 2 Python：工作空间、导航配置、部署脚本与 systemd 单元
            ros:
              - 'Master/ROS/**'
              - 'Master/Web-Next/deploy/**'
            # STM32：HAL 主固件树 + 宿主机单测 + 旧栈回退目录 + 根 Makefile
            stm32:
              - 'App/**'
              - 'Drivers/**'
              - 'Core/**'
              - 'tests/**'
              - 'STM32F407_StdPeriph/**'
              - 'Makefile'

  # ── 分支策略：feat 只接受来自 dev 的 PR ─────────────────────────
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-24.04
    # 只对 PR 事件有意义；push 事件下本 Job 直接 skip（ci-gate 允许 skip）。
    if: github.event_name == 'pull_request'
    steps:
      - name: 校验 PR 来源分支必须为 dev
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # 本工作流只对目标为 feat 系的 PR 触发，这里防御性再校验一次。
          if [ "$BASE_REF" != "feat" ] && [[ "$BASE_REF" != feat/* ]]; then
            echo "目标分支为 $BASE_REF，不在 feat 管控范围内，跳过校验。"
            exit 0
          fi
          if [ "$HEAD_REF" != "dev" ] && [[ "$HEAD_REF" != dev/* ]]; then
            echo "::error::仅允许从 dev 通过 PR 合并到 feat（当前来源分支: $HEAD_REF）"
            exit 1
          fi
          echo "分支策略校验通过：$HEAD_REF → $BASE_REF"

  # ── 卫生检查：每次必跑 ─────────────────────────────────────────
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史做「本次新增文件」的 diff

      - name: 拦截本次新增的残留文件（*.orig / *.bak / *.uvguix.*）
        env:
          EVENT_NAME:  ${{ github.event_name }}
          BEFORE_SHA:  ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA:    ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ -n "${BEFORE_SHA:-}" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BASE="$BEFORE_SHA"
          elif BASE="$(git rev-parse -q --verify "$HEAD_SHA~1" 2>/dev/null)"; then
            # 新分支首次推送 / 手动触发：before 全 0。用 HEAD~1 作基线——
            # 分支上的提交都是有父的，这样只覆盖本次引入的变更。
            echo "::warning::无 before 基线（新分支首次推送或手动触发），改用 HEAD~1。"
          else
            # 仓库里现存 26 个历史遗留残留（MDK-ARM/、STM32F407_StdPeriph/），
            # 无父提交时无法区分「本次新增」与「历史遗留」，只告警不判失败，
            # 否则门禁会永远红。
            echo "::warning::无任何父提交（根提交），无法区分新增与历史残留，跳过拦截。"
            exit 0
          fi
          ADDED="$(git diff --name-only --diff-filter=A "$BASE" "$HEAD_SHA" || true)"
          # 只拦「新增」，历史遗留的 .orig/.uvguix.* 不背锅（diff-filter=A）。
          # 注意：仓库现存 26 个历史遗留残留（MDK-ARM/、STM32F407_StdPeriph/），
          # 绝不能改成全量扫描，否则门禁一上来就是红的。
          BAD="$(printf '%s\n' "$ADDED" | grep -E '\.(orig|bak)$|\.uvguix\.' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::检测到本次新增的残留文件，禁止提交（Keil 冲突备份 / merge 副本）："
            echo "$BAD"
            exit 1
          fi
          echo "残留文件检查通过（本次新增文件无 .orig / .bak / .uvguix.*）。"

      - name: Python 语法兜底（Master/**/*.py）
        run: |
          set -euo pipefail
          # 只做编译级语法校验，不做风格检查（风格归 ruff 步骤）。
          # Master/Web/opi_robot 属于旧栈回退保命代码：这里只读校验，不改不删。
          find Master -name "*.py" -type f -print0 | xargs -0 -n1 python3 -m py_compile
          echo "py_compile 通过。"

      # ruff 是 Rust 编译出的静态二进制，不依赖 Python 环境，也不依赖 ROS 容器。
      #
      # 为什么钉版本 + 缓存：原脚本用 releases/latest/download，实测两次抖动到
      # 724s / 119s（GitHub 美国 → astral-sh 发布页链路不稳），把整个 Job 拖垮。
      # 改成「固定版本号 + actions/cache 缓存二进制」：
      #   - 命中缓存：0 网络，约 1s
      #   - 未命中：下载 ~10MB 后可复用，且版本号固定不会突然变行为
      # 升级 ruff 时只改 RUFF_VERSION 一处（缓存键随之变化，自动失效旧缓存）。
      - name: 恢复 ruff 二进制缓存
        id: ruff-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/ruff
          key: ruff-0.17.6-${{ runner.os }}-${{ runner.arch }}

      - name: 安装 ruff（缓存未命中时，固定版本 0.17.6）
        if: steps.ruff-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          RUFF_VERSION=0.17.6
          mkdir -p "$HOME/.local/bin"
          tmp="$(mktemp -d)"
          # 固定版本号（不是 latest），配合 --max-time 防止链路卡死拖垮 Job。
          curl -sSfL --retry 3 --retry-delay 2 --max-time 120 \
            -o "$tmp/ruff.tar.gz" \
            "https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-x86_64-unknown-linux-gnu.tar.gz"
          # 归档内是 ruff-x86_64-unknown-linux-gnu/ruff；解到临时目录再 install，
          # 避免 `tar --strip-components=1 ruff` 报「归档中找不到」。
          tar -xzf "$tmp/ruff.tar.gz" -C "$tmp" --strip-components=1
          install -m 0755 "$tmp/ruff" "$HOME/.local/bin/ruff"
          rm -rf "$tmp"
          "$HOME/.local/bin/ruff" --version

      - name: 让 ruff 进入 PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ruff" --version

      - name: ruff 静态检查（棘轮：只查本次变更的 .py）
        # 存量代码有 84 个 F401/F811/F841（多为测试文件未用导入），
        # 全量检查会让门禁永远红。棘轮模式：新增/修改的文件必须干净，
        # 存量债务不拦截。想改全量时去掉 diff 逻辑直接传目录即可。
        env:
          EVENT_NAME:  ${{ github.event_name }}
          BEFORE_SHA:  ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA:    ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ -n "${BEFORE_SHA:-}" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BASE="$BEFORE_SHA"
          elif BASE="$(git rev-parse -q --verify "$HEAD_SHA~1" 2>/dev/null)"; then
            # 新分支首次推送 / 手动触发：before 全 0，用 HEAD~1 作棘轮基线。
            # 绝不能用空树——那会把 84 个存量 F401/F811/F841 全算成新增。
            echo "::warning::无 before 基线，改用 HEAD~1 作 ruff 棘轮基准。"
          else
            echo "::warning::无任何父提交（根提交），ruff 棘轮无可比基线，跳过。"
            exit 0
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            # 基准提交不可达（浅克隆/强推）：退用 HEAD~1，再不行就跳过。
            if BASE="$(git rev-parse -q --verify "$HEAD_SHA~1" 2>/dev/null)"; then
              echo "::warning::基准提交不可达，改用 HEAD~1 作 ruff 棘轮基准。"
            else
              echo "::warning::基准提交不可达且无父提交，ruff 棘轮跳过。"
              exit 0
            fi
          fi
          CHANGED="$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD_SHA" \
            | grep -E '\.py$' | grep -E '^(Master/ROS|Master/Web-Next/deploy)' || true)"
          if [ -z "$CHANGED" ]; then
            echo "本次变更不含目标 Python 文件，ruff 跳过。"
            exit 0
          fi
          echo "棘轮检查以下文件："
          echo "$CHANGED"
          # shellcheck disable=SC2086
          ruff check --select F401,F811,F841 $(echo "$CHANGED" | tr '\n' ' ')

  # ── Rust Web-Next（独立 Axum 后端，非 rclrs / colcon-cargo）──────
  rust-web-next:
    name: rust-web-next
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    defaults:
      run:
        working-directory: Master/Web-Next
    steps:
      - uses: actions/checkout@v4

      # Cargo.toml 的 edition = "2024" 要求 rustc >= 1.85，stable 起步即满足。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Master/Web-Next

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -W dead_code -W unused_imports -W unused_variables

      - name: cargo test
        run: cargo test

  # ── aarch64 交叉编译（独立 Job，与上面并行）──────────────────────
  # 为什么拆出来：交叉编译要 30s，原本串在 rust-web-next 里，把该 Job 从 47s
  # 拖到 77s，成为整个流水线的关键路径。拆成独立 Job 后两个并行跑，
  # 关键路径回落到 max(clippy+test 47s, 交叉编译 38s) ≈ 47s。
  # 触发条件不变：只有合入 feat 系 PR 时跑（验证 build.rs 的 rust-lld 垫片）。
  rust-cross-aarch64:
    name: rust-cross-aarch64
    runs-on: ubuntu-24.04
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' &&
      github.event_name == 'pull_request' &&
      (github.base_ref == 'feat' || startsWith(github.base_ref, 'feat/'))
    defaults:
      run:
        working-directory: Master/Web-Next
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      # rust-cache 的自动键已含 job id，与宿主机 x86 那个 Job 的缓存天然隔离，
      # 不需要额外指定 key。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Master/Web-Next

      - name: cargo build --release --target aarch64-unknown-linux-musl
        run: |
          cargo build --release --target aarch64-unknown-linux-musl
          file target/aarch64-unknown-linux-musl/release/web_next

  # ── 前端（原生 ES Modules，无 package.json、无 npm 构建）─────────
  web-frontend:
    name: web-frontend
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 复制为 .mjs 再检查：普通脚本与 ES Modules 语法都能过。
      - name: node --check 逐个校验 web/js/*.js
        run: |
          set -euo pipefail
          mkdir -p /tmp/jscheck
          status=0
          for f in Master/Web-Next/web/js/*.js; do
            base="$(basename "${f%.js}").mjs"
            cp "$f" "/tmp/jscheck/$base"
            if ! node --check "/tmp/jscheck/$base"; then
              echo "::error::JS 语法检查失败: $f"
              status=1
            fi
          done
          exit $status

      # web_next 是单二进制内置静态资源（include_str!/include_bytes!）。
      # 这里保证：web/js|styles|fonts 下每个文件都已注册进 main.rs，
      # 且在 index.html 或 CSS 中被引用——防止新增资源忘记接线。
      - name: 校验静态资源注册与引用
        run: |
          python3 -I - <<'PYEOF'
          import pathlib, re, sys
          root = pathlib.Path("Master/Web-Next")
          mainrs = (root / "src/main.rs").read_text(encoding="utf-8")
          index = (root / "web/index.html").read_text(encoding="utf-8")
          errors = []

          # 1) main.rs 已注册的资源（相对 include：../web/...）
          registered = set(re.findall(
              r'include_(?:str|bytes)!\("\.\./(web/[^"]+)"\)', mainrs))

          # 2) index.html 引用的资源（href/src = "/..."）+ CSS url() 引用
          referenced = set(re.findall(
              r'(?:href|src)\s*=\s*["\']?/((?:js|styles|fonts)/[\w.\-]+)', index))
          for css in (root / "web/styles").glob("*.css"):
              referenced |= set(re.findall(
                  r'url\(\s*["\']?/((?:fonts|styles|js)/[^)"\']+)',
                  css.read_text(encoding="utf-8")))

          # 3) 仓库里实际存在的静态资源
          actual = {f"web/{p.relative_to(root / 'web')}"
                    for d in ("js", "styles", "fonts")
                    for p in (root / "web" / d).iterdir() if p.is_file()}

          for f in sorted(actual):
              if f not in registered:
                  errors.append(f"[未注册] {f} 未在 src/main.rs "
                                f"include_str!/include_bytes! 注册")
              ref = f[len("web/"):]
              if ref not in referenced:
                  errors.append(f"[未引用] {f} 未在 index.html 或 CSS 中引用")

          print(f"registered={len(registered)} referenced={len(referenced)} "
                f"actual={len(actual)}")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PYEOF

  # ── ROS 2 Humble（容器内构建，不依赖宿主机环境）────────────────
  ros2-python:
    name: ros2-python
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.ros == 'true'
    container:
      image: ros:humble-ros-base
    defaults:
      run:
        shell: bash   # 镜像默认 shell 是 sh，不认识 pipefail
    env:
      # 容器以 root 运行，checkout 出的工作区属主是 runner 用户，
      # git 会报 "detected dubious ownership" 并 exit 128。
      # 用 GIT_CONFIG_* 注入 safe.directory，避免写 /github/home/.gitconfig。
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"
    steps:
      # ruff 已整体挪到 hygiene Job（宿主机静态二进制，约 3 秒）。
      # 本 Job 只负责 ROS 容器的构建与测试。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 注意：不能用 set -u，ROS 的 setup.bash 引用了未定义变量
      # （AMENT_TRACE_SETUP_FILES 等），-u 会直接炸。
      # GitHub 默认 shell 已带 -e -o pipefail，这里不重复 set。
      - name: colcon build
        run: |
          source /opt/ros/humble/setup.bash
          cd Master/ROS/ros2_ws
          colcon build --symlink-install

      - name: colcon test（全量执行，成败交由下一步的基线比对定）
        run: |
          # 每个 run 步骤都是独立 shell，工作目录回到 $GITHUB_WORKSPACE，
          # 必须先 cd 进工作空间再 source install/setup.bash。
          source /opt/ros/humble/setup.bash
          cd Master/ROS/ros2_ws
          source install/setup.bash
          # 仓库现有存量失败（部分测试引用了从未入库的本机文件），
          # 不能因 set -e 中断；真正的门禁在下一步做基线比对。
          # pytest 的 skip（无实机硬件 / 无 Chrome）不判失败。
          colcon test --event-handlers console_direct- || true

      - name: 测试结果基线比对（基线外的新失败判为回归）
        # 与 ruff 棘轮同一思路：存量债务不阻断，新增回归必须拦。
        # skip 不算失败。详见 .github/scripts/compare_ros2_tests.py。
        run: |
          # colcon test-result 仅作人类可读汇总（它把存量失败也算进去，
          # 所以不能拿它的退出码当门禁），真正的判定交给基线比对脚本。
          cd Master/ROS/ros2_ws
          colcon test-result --verbose 2>&1 | tail -40 || true
          cd "$GITHUB_WORKSPACE"
          python3 .github/scripts/compare_ros2_tests.py

  # ── STM32F407（宿主机 C 单测 + 交叉编译主固件）─────────────────
  stm32-host-tests:
    name: stm32-host-tests
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.stm32 == 'true'
    steps:
      - uses: actions/checkout@v4

      # tests/Makefile 的 all 目标「边编译边运行」，PASS 直接打印。
      - name: 宿主机 C 单测（tests/Makefile，编译并运行全部测试）
        run: make -C tests -j4

      # arm-none-eabi 用官方 GNU 工具链 tarball + 缓存，不再走 apt：
      # apt 依赖 Ubuntu 镜像源，实测出现过单步挂起 8 分钟以上的情况，
      # 而本 Job 是 ci-gate 之前最后一个 Job，一卡就把整条流水线拖长。
      # 官方包自带 newlib 头文件与库，不需要额外装 libnewlib-arm-none-eabi。
      - name: 恢复 arm-none-eabi 工具链压缩包缓存
        id: arm-cache
        uses: actions/cache@v4
        with:
          path: ~/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz
          key: arm-gnu-13.3.rel1-${{ runner.os }}

      - name: 下载 arm-none-eabi 工具链（缓存未命中时）
        if: steps.arm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --retry-delay 5 --max-time 300 \
            -o "$HOME/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz"

      - name: 解压工具链并自检
        run: |
          set -euo pipefail
          mkdir -p "$HOME/arm-gnu-toolchain"
          tar -xJf "$HOME/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz" \
            -C "$HOME/arm-gnu-toolchain" --strip-components=1
          echo "$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"
          "$HOME/arm-gnu-toolchain/bin/arm-none-eabi-gcc" --version | head -1

      # 根 Makefile 是当前主固件入口（HAL，TARGET=Diff_Car，产物 hex/bin）。
      # STM32F407_StdPeriph 是旧栈回退代码，CI 只读检查、不自动改删。
      - name: 交叉编译主固件（根 Makefile / HAL）
        run: |
          set -euo pipefail
          make -j"$(nproc)"
          test -f build/Diff_Car.hex || { echo "::error::未生成 build/Diff_Car.hex"; exit 1; }
          test -f build/Diff_Car.bin || { echo "::error::未生成 build/Diff_Car.bin"; exit 1; }
          ls -l build/Diff_Car.hex build/Diff_Car.bin

  # ── 汇总门禁：feat 分支唯一 Required Status Check ───────────────
  # 为什么需要它：paths-filter 会让未命中路径的 Job skip，而 GitHub 把
  # skip 的必需检查视为「未完成」，PR 会永久卡在 waiting。
  # 用 always() 的单一汇总 Job 兜住：前置 Job 是 success 或 skipped 即放行，
  # 任一 failure / cancelled 则失败。feat 分支只需勾选 ci-gate 一项。
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    needs:
      - changes
      - branch-policy
      - hygiene
      - rust-web-next
      - rust-cross-aarch64
      - web-frontend
      - ros2-python
      - stm32-host-tests
    if: always()
    steps:
      - name: 汇总门禁（必要 Job 均须 success / skipped）
        env:
          R_CHANGES:  ${{ needs.changes.result }}
          R_POLICY:   ${{ needs.branch-policy.result }}
          R_HYGIENE:  ${{ needs.hygiene.result }}
          R_RUST:     ${{ needs.rust-web-next.result }}
          # 交叉编译拆成独立 Job 后必须同步登记，否则 set -u 会因变量未绑定直接失败。
          R_RUST_CROSS: ${{ needs.rust-cross-aarch64.result }}
          R_FRONTEND: ${{ needs.web-frontend.result }}
          R_ROS:      ${{ needs.ros2-python.result }}
          R_STM32:    ${{ needs.stm32-host-tests.result }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" = "failure" ] || [ "$2" = "cancelled" ]; then
              echo "::error::门禁失败：Job [$1] 结果为 $2"
              fail=1
            else
              echo "Job [$1]: $2（允许）"
            fi
          }
          check "changes"          "$R_CHANGES"
          check "branch-policy"    "$R_POLICY"
          check "hygiene"          "$R_HYGIENE"
          check "rust-web-next"    "$R_RUST"
          check "rust-cross-aarch64" "$R_RUST_CROSS"
          check "web-frontend"     "$R_FRONTEND"
          check "ros2-python"      "$R_ROS"
          check "stm32-host-tests" "$R_STM32"
          if [ "$fail" -ne 0 ]; then
            echo "ci-gate: 失败"
            exit 1
          fi
          echo "ci-gate: 通过"
