# =====================================================================
# XZCIT-IIR 持续集成
#
# 分支治理规则（与分支保护配置配套，见分支保护清单）：
#   - main        ：纯发布分支，不跑 CI、不设 PR 限制（不在任何触发器里）。
#   - dev / dev/* ：日常开发分支，允许直接 push，推送即触发全套检查。
#   - feat / feat/*：受保护分支，禁止直接 push；只允许从 dev 通过 PR 合入，
#                   PR 时必须通过 branch-policy 与 ci-gate 门禁。
#
# 结构说明：
#   - changes：dorny/paths-filter 按目录过滤变更，未命中路径的 Job 直接 skip。
#   - ci-gate：if: always() 的汇总门禁（feat 分支唯一 Required Status Check），
#     所有前置必要 Job 结果为 success / skipped 才放行，任一 failure /
#     cancelled 即失败——避免路径过滤跳过导致 PR 卡住。
# =====================================================================
name: XZCIT CI

on:
  push:
    branches:
      - dev
      - 'dev/**'
  pull_request:
    branches:
      - feat
      - 'feat/**'
  # 手动触发：仅用于在受保护分支（feat）上制造一次真实的 ci-gate 运行记录。
  # 原因：GitHub 分支保护的 required status checks 候选列表只收录
  # "在受保护分支上真实跑过的 check"；feat 平时不接受 push、也没有以它自身
  # 为 head 的 PR，配门禁时搜不到 ci-gate。手动跑一次即可补齐这条记录。
  # 手动触发不改变任何自动触发语义，不影响分支治理规则。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支连续推送只保留最新一次运行，避免浪费算力。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 变更过滤：决定哪些技术栈 Job 需要跑 ─────────────────────────
  changes:
    name: detect-changes
    runs-on: ubuntu-24.04
    outputs:
      rust:     ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ros:      ${{ steps.filter.outputs.ros }}
      stm32:    ${{ steps.filter.outputs.stm32 }}
    steps:
      - uses: actions/checkout@v4
      - name: 按目录过滤变更
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 手动触发时没有 github.event.before，dorny/paths-filter 会因缺少基线报错，
          # 导致全部 Job 被 skip（ci-gate 照样绿，但等于没验证）。
          # 用 <sha>~1 兜底，让 diff 覆盖整条待验证的变更，真实跑全套。
          # push / pull_request 场景不受影响（仍走各自的原生基线）。
          base: ${{ github.event_name == 'workflow_dispatch' && format('{0}~1', github.sha) || '' }}
          filters: |
            rust:
              - 'Master/Web-Next/**'
            frontend:
              - 'Master/Web-Next/web/**'
              - 'Master/Web-Next/src/main.rs'
            ros:
              - 'Master/ROS/**'
              - 'Master/Web-Next/deploy/**'
            stm32:
              - 'App/**'
              - 'Drivers/**'
              - 'Core/**'
              - 'tests/**'
              - 'STM32F407_StdPeriph/**'
              - 'Makefile'

  # ── 分支策略：feat 只接受来自 dev 的 PR ─────────────────────────
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: 校验 PR 来源分支必须为 dev
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # 本工作流只对目标为 feat / feat/* 的 PR 触发，防御性再校验一次。
          if [ "$BASE_REF" != "feat" ] && [[ "$BASE_REF" != feat/* ]]; then
            echo "目标分支为 $BASE_REF，不在 feat 管控范围内，跳过校验。"
            exit 0
          fi
          if [ "$HEAD_REF" != "dev" ] && [[ "$HEAD_REF" != dev/* ]]; then
            echo "::error::仅允许从 dev 通过 PR 合并到 feat（当前来源分支: $HEAD_REF）"
            exit 1
          fi
          echo "分支策略校验通过：$HEAD_REF → $BASE_REF"

  # ── 卫生检查：每次必跑 ─────────────────────────────────────────
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史做本次新增文件的 diff

      - name: 拦截本次新增的残留文件（*.orig / *.bak / *.uvguix.*）
        env:
          EVENT_NAME:      ${{ github.event_name }}
          BEFORE_SHA:      ${{ github.event.before }}
          PR_BASE_SHA:     ${{ github.event.pull_request.base.sha }}
          HEAD_SHA:        ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BASE="$BEFORE_SHA"
          else
            # 新分支首次推送：本分支上引入的所有文件都视为"本次新增"。
            BASE="$(git hash-object -t tree /dev/null)"
            echo "::warning::新分支首次推送，将全量扫描该分支引入的文件。"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
            echo "::warning::基准提交 $BASE 不在历史中（疑似强推），退化为全量扫描。"
          fi
          ADDED="$(git diff --name-only --diff-filter=A "$BASE" "$HEAD_SHA" || true)"
          # 只拦"新增"，历史遗留的 .orig/.uvguix.* 不背锅（diff-filter=A）。
          BAD="$(printf '%s\n' "$ADDED" | grep -E '\.(orig|bak)$|\.uvguix\.' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::检测到本次新增的残留文件，禁止提交（Keil 冲突备份 / merge 副本）："
            echo "$BAD"
            exit 1
          fi
          echo "残留文件检查通过（本次新增文件无 .orig / .bak / .uvguix.*）。"

      - name: Python 语法兜底（Master/**/*.py）
        run: |
          set -euo pipefail
          # 只做编译级语法校验，不做风格检查（风格归各 Job 的专项工具）。
          find Master -name "*.py" -type f -print0 | xargs -0 -n1 python3 -m py_compile
          echo "py_compile 通过。"

      # ruff 是 Rust 编译出来的静态二进制，不依赖 Python 环境，也不依赖 ROS。
      # 原先把它塞进 ros:humble-ros-base 容器里，apt 装 pip 再 pip 装 ruff，
      # 实测单这一步耗时 119 秒，占 ros2-python 整个 Job 的 68%，而真正的
      # colcon build 只要 2 秒、colcon test 只要 29 秒——纯属本末倒置。
      # 挪到宿主机 + 官方预编译包，下载解压约 3 秒。
      - name: 安装 ruff（官方静态二进制，不依赖 pip / apt）
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          # 踩过的坑：tar 提取时若指定成员名，必须与归档内完整路径一致。
          # 归档里是 ruff-x86_64-unknown-linux-gnu/ruff，写 `... --strip-components=1 ruff`
          # 会报 "ruff: 归档中找不到" 并 exit 2（本地已复现）。
          # 这里解到临时目录再 install，既避开该问题，出错信息也更明确。
          tmp="$(mktemp -d)"
          curl -sSfL --retry 3 --retry-delay 2 \
            -o "$tmp/ruff.tar.gz" \
            "https://github.com/astral-sh/ruff/releases/latest/download/ruff-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$tmp/ruff.tar.gz" -C "$tmp" --strip-components=1
          install -m 0755 "$tmp/ruff" "$HOME/.local/bin/ruff"
          rm -rf "$tmp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ruff" --version

      - name: ruff 静态检查（棘轮模式：只查本次变更的 .py）
        # 存量代码上已有 84 个 F401/F811/F841（多为测试文件的未用导入），
        # 全量检查会让门禁永远红。棘轮模式：新增/修改过的文件必须干净，
        # 存量债务不拦截。想改全量时去掉 diff 逻辑直接传目录即可。
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BASE="$BEFORE_SHA"
          else
            BASE="$(git hash-object -w -t tree /dev/null)"
            echo "::warning::新分支首次推送，ruff 将扫描该分支引入的全部 .py。"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            # 基准提交不在本地历史（浅克隆/强推等），退而求其次用上一个提交；
            # 再不行就写入空树对象做全量 diff（-w 必须带上，否则对象不在库里）。
            if BASE="$(git rev-parse -q --verify HEAD~1 2>/dev/null)"; then
              echo "::warning::基准提交不可达，改用 HEAD~1 作 ruff 棘轮基准。"
            else
              BASE="$(git hash-object -w -t tree /dev/null)"
              echo "::warning::首次提交，ruff 将扫描全部 .py。"
            fi
          fi
          CHANGED="$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD_SHA" \
            | grep -E '\.py$' | grep -E '^(Master/ROS|Master/Web-Next/deploy)' || true)"
          if [ -z "$CHANGED" ]; then
            echo "本次变更不含目标 Python 文件，ruff 跳过。"
            exit 0
          fi
          echo "棘轮检查以下文件："
          echo "$CHANGED"
          # shellcheck disable=SC2086
          ruff check --select F401,F811,F841 $(echo "$CHANGED" | tr '\n' ' ')

  # ── Rust Web-Next（独立 Axum 后端，非 rclrs）────────────────────
  rust-web-next:
    name: rust-web-next
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    defaults:
      run:
        working-directory: Master/Web-Next
    steps:
      - uses: actions/checkout@v4

      # edition = "2024" 要求 rustc >= 1.85，stable 起步即满足。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Master/Web-Next

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -W dead_code -W unused_imports -W unused_variables

      - name: cargo test
        run: cargo test

      # 合入 feat 的 PR 才做交叉编译检查，确认 build.rs 垫片在 CI 环境可用。
      - name: aarch64-musl 交叉编译检查（仅合入 feat 的 PR）
        if: github.event_name == 'pull_request' && (github.base_ref == 'feat' || startsWith(github.base_ref, 'feat/'))
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl
          file target/aarch64-unknown-linux-musl/release/web_next

  # ── 前端（无 npm 构建的原生脚本，不做任何打包）─────────────────
  web-frontend:
    name: web-frontend
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 复制为 .mjs 再检查：普通脚本与 ES Modules 语法都能过。
      - name: node --check 逐个校验 web/js/*.js
        run: |
          set -euo pipefail
          mkdir -p /tmp/jscheck
          status=0
          for f in Master/Web-Next/web/js/*.js; do
            base="$(basename "${f%.js}").mjs"
            cp "$f" "/tmp/jscheck/$base"
            if ! node --check "/tmp/jscheck/$base"; then
              echo "::error::JS 语法检查失败: $f"
              status=1
            fi
          done
          exit $status

      # web_next 是单二进制内置静态资源（include_str!/include_bytes!），
      # 这里保证：目录里的每个资源都已注册进 main.rs，且在页面/CSS 中引用。
      - name: 校验静态资源注册与引用
        run: |
          python3 - <<'PYEOF'
          import pathlib, re, sys
          root = pathlib.Path("Master/Web-Next")
          mainrs = (root / "src/main.rs").read_text(encoding="utf-8")
          index = (root / "web/index.html").read_text(encoding="utf-8")
          errors = []

          # 1) main.rs 已注册的资源（相对 include：../web/...）
          registered = set(re.findall(
              r'include_(?:str|bytes)!\("\.\./(web/[^"]+)"\)', mainrs))

          # 2) index.html 引用的资源（href/src = "/..."）+ CSS url() 引用的资源
          referenced = set(re.findall(
              r'(?:href|src)\s*=\s*["\']?/((?:js|styles|fonts)/[\w.\-]+)', index))
          for css in (root / "web/styles").glob("*.css"):
              referenced |= set(re.findall(
                  r'url\(\s*["\']?/((?:fonts|styles|js)/[^)"\']+)',
                  css.read_text(encoding="utf-8")))

          # 3) 仓库里实际存在的静态资源
          actual = {f"web/{p.relative_to(root / 'web')}"
                    for d in ("js", "styles", "fonts")
                    for p in (root / "web" / d).iterdir() if p.is_file()}

          for f in sorted(actual):
              if f not in registered:
                  errors.append(f"[未注册] {f} 未在 src/main.rs "
                                f"include_str!/include_bytes! 注册")
              ref = f[len("web/"):]
              if ref not in referenced:
                  errors.append(f"[未引用] {f} 未在 index.html 或 CSS 中引用")

          print(f"registered={len(registered)} referenced={len(referenced)} "
                f"actual={len(actual)}")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PYEOF

  # ── ROS 2 Humble（容器内构建，不依赖宿主机环境）────────────────
  ros2-python:
    name: ros2-python
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.ros == 'true'
    container:
      image: ros:humble-ros-base
    defaults:
      run:
        shell: bash   # 镜像默认 shell 是 sh，不认识 set -o pipefail
    env:
      # 容器以 root 运行，而 checkout 出来的工作区属主是 runner 用户（uid 1001），
      # git 会报 "detected dubious ownership" 并以 exit 128 中断。
      # 用 GIT_CONFIG_* 环境变量注入 safe.directory（Git 2.31+），
      # 避免写 /github/home/.gitconfig 时撞上该目录不可写的权限问题。
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"
    steps:
      # ruff 静态检查已整体挪到 hygiene Job（宿主机 + 官方静态二进制，约 3 秒）。
      # 容器里那套 apt 装 pip、pip 装 ruff 的链路实测耗时 119 秒，占本 Job 的 68%，
      # 而 colcon build 只要 2 秒、colcon test 只要 29 秒，完全不成比例。
      # 本 Job 从此只负责 ROS 容器的构建与测试。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   # 基线比对只读工作区文件，不依赖 git 历史

      # 注意：不能用 set -u，ROS 的 setup.bash 引用了未定义变量
      # （AMENT_TRACE_SETUP_FILES 等），-u 会直接炸。GitHub 默认 shell
      # 已带 -e -o pipefail，这里不重复 set。
      - name: colcon build
        run: |
          source /opt/ros/humble/setup.bash
          cd Master/ROS/ros2_ws
          colcon build --symlink-install

      - name: colcon test（执行全量测试，成败交由下一步的基线比定）
        run: |
          # 每个 run 步骤都是独立 shell，工作目录回到 $GITHUB_WORKSPACE，
          # 必须先 cd 进工作空间再 source install/setup.bash。
          source /opt/ros/humble/setup.bash
          cd Master/ROS/ros2_ws
          source install/setup.bash
          # 仓库现有 179 个存量失败（134 个是测试引用了从未入库的本机文件），
          # 这里不能因 set -e 中断，真正的门禁在下一步做基线比对。
          colcon test --event-handlers console_direct- || true

      - name: 测试结果基线比对（基线外的新失败判为回归）
        # 与 ruff 棘轮同一思路：存量债务不阻断，新增回归必须拦。
        # 详见 .github/scripts/compare_ros2_tests.py 的注释。
        run: |
          # colcon test-result 仅作人类可读的汇总（它会把存量失败也算进去，
          # 所以不能拿它的退出码当门禁），真正的判定交给基线比对脚本。
          cd Master/ROS/ros2_ws
          colcon test-result --verbose 2>&1 | tail -40 || true
          cd "$GITHUB_WORKSPACE"
          python3 .github/scripts/compare_ros2_tests.py

  # ── STM32F407（宿主机 C 单测 + 交叉编译主固件）─────────────────
  stm32-host-tests:
    name: stm32-host-tests
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.stm32 == 'true'
    steps:
      - uses: actions/checkout@v4

      # tests/Makefile 的 all 目标"边编译边运行"，PASS 直接打印。
      - name: 宿主机 C 单测（tests/Makefile，编译并运行全部测试）
        run: make -C tests -j4

      - name: 安装 arm-none-eabi 工具链
        run: |
          sudo apt-get update
          # libnewlib-arm-none-eabi 提供 newlib 头文件（string.h 等），
          # 缺了它 arm_math.h 编不过（--no-install-recommends 会漏装）。
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi

      # 根 Makefile 为当前主固件入口（HAL，TARGET=Diff_Car，产物 hex/bin）。
      # STM32F407_StdPeriph 为旧栈回退代码，CI 只读检查、不自动改删。
      - name: 交叉编译主固件（根 Makefile / HAL）
        run: |
          set -euo pipefail
          make -j"$(nproc)"
          test -f build/Diff_Car.hex || { echo "::error::未生成 build/Diff_Car.hex"; exit 1; }
          test -f build/Diff_Car.bin || { echo "::error::未生成 build/Diff_Car.bin"; exit 1; }
          ls -l build/Diff_Car.hex build/Diff_Car.bin

  # ── 汇总门禁：feat 分支唯一 Required Status Check ───────────────
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    needs:
      - changes
      - branch-policy
      - hygiene
      - rust-web-next
      - web-frontend
      - ros2-python
      - stm32-host-tests
    if: always()
    steps:
      - name: 汇总门禁（必要 Job 均须 success / skipped）
        env:
          R_CHANGES:   ${{ needs.changes.result }}
          R_POLICY:    ${{ needs.branch-policy.result }}
          R_HYGIENE:   ${{ needs.hygiene.result }}
          R_RUST:      ${{ needs.rust-web-next.result }}
          R_FRONTEND:  ${{ needs.web-frontend.result }}
          R_ROS:       ${{ needs.ros2-python.result }}
          R_STM32:     ${{ needs.stm32-host-tests.result }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" = "failure" ] || [ "$2" = "cancelled" ]; then
              echo "::error::门禁失败：Job [$1] 结果为 $2"
              fail=1
            else
              echo "Job [$1]: $2（允许）"
            fi
          }
          check "changes"          "$R_CHANGES"
          check "branch-policy"    "$R_POLICY"
          check "hygiene"          "$R_HYGIENE"
          check "rust-web-next"    "$R_RUST"
          check "web-frontend"     "$R_FRONTEND"
          check "ros2-python"      "$R_ROS"
          check "stm32-host-tests" "$R_STM32"
          if [ "$fail" -ne 0 ]; then
            echo "ci-gate: 失败"
            exit 1
          fi
          echo "ci-gate: 通过"
