# =====================================================================
# XZCIT-IIR 标签自动发布
#
# 触发：
#   - 推送 v* 标签（建议在 feat 分支上打 tag）
#   - workflow_dispatch 手动演练（不创建 Release，仅产出 Artifacts）
#
# 产物：
#   1. web-next-<tag>-aarch64-linux-musl.tar.gz
#      香橙派全静态部署包：web_next 二进制 + web/ + deploy 脚本与 systemd 单元
#   2. stm32f407-firmware-<tag>.tar.gz + 独立 Diff_Car.hex/.bin
#      根 Makefile（HAL）现场编译，不使用仓库内历史预编译文件
#   3. SHA256SUMS.txt 全量校验文件
# =====================================================================
name: XZCIT Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # 发布流水线不允许中途互相取消

env:
  # tag 推送 → 用 tag 名；手动演练 → 用 manual-<run编号>，避免分支名带斜杠破坏文件名。
  TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || format('manual-{0}', github.run_number) }}

jobs:
  # ── 发布前门禁：单测不过，不发版 ────────────────────────────────
  gate-rust-test:
    name: gate-rust-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Master/Web-Next
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Master/Web-Next

      - name: cargo test（Web-Next 单测）
        run: cargo test

  gate-stm32-host-test:
    name: gate-stm32-host-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 宿主机 C 单测（tests/Makefile，编译并运行全部测试）
        run: make -C tests -j4

  # ── 香橙派 Web-Next 静态部署包（aarch64 musl）──────────────────
  build-web-next:
    name: build-web-next-aarch64-musl
    needs: gate-rust-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Master/Web-Next
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Master/Web-Next

      # build.rs 垫片自动指定 rust-lld，链接无需外部交叉工具链；
      # musl 目标默认 crt-static，产出全静态二进制。
      - name: cargo build --release --target aarch64-unknown-linux-musl
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: 校验产物为全静态 aarch64 ELF
        run: |
          set -euo pipefail
          BIN=target/aarch64-unknown-linux-musl/release/web_next
          test -f "$BIN" || { echo "::error::未找到 $BIN"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q "ARM aarch64" || { echo "::error::不是 aarch64 ELF"; exit 1; }
          file "$BIN" | grep -qi "statically linked" || { echo "::error::不是全静态链接，禁止发布"; exit 1; }

      - name: 打包部署产物（web_next + web/ + deploy 脚本与 systemd 单元）
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE/deploy"
          cp target/aarch64-unknown-linux-musl/release/web_next "$STAGE/"
          cp -r web "$STAGE/web"
          cp deploy/ros_bridge_shim.py deploy/relocalize.py "$STAGE/deploy/"
          cp deploy/*.service "$STAGE/deploy/"
          tar czf "$RUNNER_TEMP/web-next-${{ env.TAG_NAME }}-aarch64-linux-musl.tar.gz" -C "$STAGE" .
          ls -lh "$RUNNER_TEMP"/web-next-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: web-next-package
          path: ${{ runner.temp }}/web-next-*.tar.gz
          if-no-files-found: error

  # ── STM32F407 固件产物（根 Makefile / HAL，现场编译）────────────
  build-firmware:
    name: build-stm32-firmware
    needs: gate-stm32-host-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 arm-none-eabi 工具链
        run: |
          sudo apt-get update
          # libnewlib-arm-none-eabi 提供 newlib 头文件，缺了它 arm_math.h 编不过。
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: 现场编译主固件（根 Makefile / HAL，TARGET=Diff_Car）
        run: |
          set -euo pipefail
          make -j"$(nproc)"
          test -f build/Diff_Car.hex || { echo "::error::未生成 build/Diff_Car.hex"; exit 1; }
          test -f build/Diff_Car.bin || { echo "::error::未生成 build/Diff_Car.bin"; exit 1; }
          ls -l build/Diff_Car.elf build/Diff_Car.hex build/Diff_Car.bin

      - name: 归集固件产物
        run: |
          set -euo pipefail
          mkdir -p firmware
          cp build/Diff_Car.elf build/Diff_Car.hex build/Diff_Car.bin firmware/
          tar czf "stm32f407-firmware-${{ env.TAG_NAME }}.tar.gz" -C firmware .

      - uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware
          path: |
            stm32f407-firmware-*.tar.gz
            firmware/Diff_Car.hex
            firmware/Diff_Car.bin
          if-no-files-found: error

  # ── 发布：SHA256SUMS + GitHub Release ─────────────────────────
  release:
    name: github-release
    needs: [build-web-next, build-firmware]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇集产物并生成 SHA256SUMS.txt
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          ls -lh

      # 手动演练只出 Artifacts，不建 Release；tag 推送才正式发布。
      - name: 创建 GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/web-next-*
            dist/stm32f407-firmware-*
            dist/Diff_Car.hex
            dist/Diff_Car.bin
            dist/SHA256SUMS.txt
